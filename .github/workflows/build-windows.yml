name: Build Windows App
on:
  workflow_dispatch:
    inputs:
      version_note:
        description: 'Optional note for this manual build'
        required: false
        default: 'Manual release'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch gradle.properties for Windows
        shell: bash
        run: |
            sed -i '/org.gradle.java.home/d' gradle.properties
            sed -i '/compose.desktop.application.javaHome/d' gradle.properties
            echo "✅ Linux-specific paths removed from gradle.properties"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Create local.properties
        shell: bash
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cp local.properties app-desktop/local.properties
          echo "✅ Minimal local.properties created"
      - name: Build EXE
        shell: bash
        run: ./gradlew :app-desktop:packageExe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CommandsBox-Windows-EXE
          path: app-desktop/build/compose/binaries/main/exe/*.exe
          retention-days: 5